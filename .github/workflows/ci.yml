name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # the generated code is compiled and run with the real toolchains
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Browser check (Chromium)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Extension in a real VS Code
        run: xvfb-run -a node scripts/vscode-test.mjs

      - name: Package the VS Code extension
        run: npm run package:vscode

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: extension/*.vsix
